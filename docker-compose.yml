# upstream-streaming-server — local development compose file.
#
# Brings up a single MediaMTX container that listens for SRT publishes,
# republishes over RTSP/WebRTC, and exposes a local HTTP API for inspection.
#
# As of M4/M5/M6 this same compose file also drives the shipped lifecycle
# against upstream-api-server: the `authMethod: http` SRT deny gate (M4.1),
# the runOnReady/runOnNotReady hooks (stream-started/ended webhooks + M5
# ffprobe media validation), and the M6 latest-frame snapshotter. The
# earlier "local smoke testing only, no auth/validation/webhooks" note was
# accurate at M1 and is no longer true. See docs/local-dev.md for usage and
# docs/architecture.md for the milestone map.
#
# M9.1 hardening (docs/design/03-isolation-and-blast-radius.md §3,
# docs/design/05-security-hardening.md §3): resource fences
# (cpus/mem_limit/pids_limit/nofile), json-file log rotation, and
# localhost-by-default host bindings for :9997 (API) and :19998 (metrics
# host port; container :9998, M9.2). Dev-laptop-safe defaults; production
# overrides via the
# UPSTREAM_MEDIAMTX_* envs documented in .env.example plus
# scripts/firewall-restrict-readports.sh for the opened ports.
#
# Production hardening still TODO: container runs as root and the read
# ports (8554/8889) bind all interfaces (locked down only by
# scripts/firewall-restrict-readports.sh) — non-root/read-only/cap-drop
# is scheduled M11.3 (docs/design/05 §2).

services:
  mediamtx:
    # TODO: review this pin before production. Bumping MediaMTX can change
    # config-key names and protocol behavior — re-test smoke scripts after any
    # version bump. The Dockerfile pins the same version; keep them aligned.
    build:
      context: .
      dockerfile: Dockerfile
    container_name: upstream-mediamtx
    restart: unless-stopped
    # --- M9.1 resource fences (docs/design/03-isolation-and-blast-radius.md §3)
    # cpus/mem_limit are CEILINGS, not reservations. Defaults are sized so a
    # dev laptop is safe; production overrides via .env / host env:
    #   UPSTREAM_MEDIAMTX_CPUS=6.0       prod 8-vCPU node uses 6.0 — a
    #                                    ceiling, not a reservation (doc 03 §3)
    #   UPSTREAM_MEDIAMTX_MEM_LIMIT=12g  prod 16 GB node uses 12g
    cpus: "${UPSTREAM_MEDIAMTX_CPUS:-2.0}"
    mem_limit: "${UPSTREAM_MEDIAMTX_MEM_LIMIT:-2g}"
    # Fork-bomb fence: until hookd (M11.1) every publisher connect/disconnect
    # forks bash+curl+ffprobe+jq under THIS container's cgroup. Deliberately
    # not parameterized — the fence must not be relaxable by an unset env.
    pids_limit: 1024
    # Reader FDs (doc 03 §3).
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
    # Docker log rotation (docs/design/01-observability.md §4): a chatty node
    # (hook JSON lines + MediaMTX logs) must not fill its own disk.
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "5"
    # MediaMTX's authHTTP (and the M4 lifecycle hooks) need to reach
    # upstream-api-server. In local dev that's typically a host-side
    # process at host.docker.internal:8000. Docker Desktop on macOS /
    # Windows resolves that hostname automatically; this mapping is the
    # Linux Docker Engine equivalent — harmless no-op on Docker Desktop.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    # Run as root inside the container; MediaMTX does not need extra caps for
    # the protocols enabled here.
    ports:
      # SRT ingest (UDP). Agents publish to this port.
      - "18890:8890/udp"
      # RTSP read endpoint (TCP). Used by ffplay/ffprobe in the smoke scripts
      # AND by the M4 `runOnReady` hook to ffprobe the local re-stream.
      - "8554:8554/tcp"
      # WebRTC signaling/WHEP (HTTP). Browser-friendly read path.
      - "8889:8889/tcp"
      # WebRTC ICE/media (UDP). MediaMTX advertises this for peer media.
      - "8189:8189/udp"
      # MediaMTX HTTP API. Used locally for `curl localhost:9997/v3/paths/list`.
      # M9.1 (docs/design/05-security-hardening.md §3): host-binds 127.0.0.1
      # by default — resolves the long-standing "do NOT expose 9997 publicly"
      # TODO. Production sets UPSTREAM_MEDIAMTX_API_BIND=0.0.0.0 and relies on
      # scripts/firewall-restrict-readports.sh to allow-list the api-server
      # egress IP only.
      - "${UPSTREAM_MEDIAMTX_API_BIND:-127.0.0.1}:9997:9997/tcp"
      # MediaMTX Prometheus metrics (M9.2, docs/design/01-observability.md §2,
      # ledger LG-1; enabled in mediamtx/mediamtx.yml). Host-published as
      # 19998 (container 9998) per the 1xxxx host-port convention and the
      # docs/design/05 §3 port table — upstream-monitoring's Prometheus
      # scrapes ingest.upstreamcv.com:19998 (FU-14). Same bind pattern as
      # :9997: localhost by default (local scrape: 127.0.0.1:19998);
      # production sets UPSTREAM_MEDIAMTX_METRICS_BIND=0.0.0.0 and firewalls
      # 19998 to the monitoring box IP only via
      # scripts/firewall-restrict-readports.sh (MONITORING_IP env).
      - "${UPSTREAM_MEDIAMTX_METRICS_BIND:-127.0.0.1}:19998:9998/tcp"
    volumes:
      - ./mediamtx/mediamtx.yml:/mediamtx.yml:ro
      # M4 hook scripts mounted read-only. MediaMTX execs `/hooks/on_ready.sh`
      # and `/hooks/on_not_ready.sh` per the `runOnReady` / `runOnNotReady`
      # entries in mediamtx.yml. on_ready.sh also spawns /hooks/snapshotter.sh
      # (M6.1A) — still read-only; scripts never write into /hooks.
      - ./scripts/hooks:/hooks:ro
      # M6.1A latest-frame JPEG output. WRITABLE: snapshotter.sh (spawned
      # detached by on_ready.sh only when validation passes) atomically
      # writes /snapshots/<MTX_PATH>.jpg here. LOCAL ONLY — nothing is
      # uploaded yet (deferred to M6.2 / FU-9). Host ./snapshots is
      # gitignored; ./snapshots/.gitkeep keeps the bind-mount source dir.
      - ./snapshots:/snapshots:rw
    environment:
      # M4 webhook auth + target. Read from the host shell or `.env`.
      # Both must be set; hooks fail-loud (exit non-zero) if missing.
      UPSTREAM_API_BASE_URL: ${UPSTREAM_API_BASE_URL}
      UPSTREAM_MEDIAMTX_WEBHOOK_SECRET: ${UPSTREAM_MEDIAMTX_WEBHOOK_SECRET}
      # M5.2 enforcement gate. Optional; defaults OFF so an unset host env
      # keeps M5.1 observe/report behavior. 0 = M5.1 report-only; 1 = M5.2
      # enforcement (failed validation -> POST /v1/ingest/validation-failed,
      # which marks the session failed and may deprovision the MediaMTX path).
      UPSTREAM_VALIDATION_ENFORCE: ${UPSTREAM_VALIDATION_ENFORCE:-0}
      # M4.1 authHTTP deny gate. MediaMTX 1.9.3 does NOT expand ${VAR}
      # references inside its own YAML, so the full URL (with the shared
      # secret as a path segment) is composed by docker-compose here and
      # passed in as MTX_AUTHHTTPADDRESS — MediaMTX's standard env-var
      # override mechanism for any top-level config key. Keeping the URL
      # out of mediamtx/mediamtx.yml keeps the secret out of the file.
      MTX_AUTHHTTPADDRESS: ${UPSTREAM_API_BASE_URL}/v1/ingest/mediamtx-auth/${UPSTREAM_MEDIAMTX_WEBHOOK_SECRET}
      # M6.1A local latest-frame snapshotter. Spawned detached by
      # on_ready.sh ONLY when media validation passed. All optional; an
      # unset host env keeps the documented defaults (the `:-default`
      # form means no compose warning), same pattern as
      # UPSTREAM_VALIDATION_ENFORCE above. LOCAL ONLY — no upload (FU-9).
      # UPSTREAM_SNAPSHOT_RTSP_URL is intentionally NOT wired here: it is
      # an internal override only and defaults from MTX_PATH.
      UPSTREAM_SNAPSHOTTER_ENABLED: ${UPSTREAM_SNAPSHOTTER_ENABLED:-1}
      UPSTREAM_SNAPSHOT_INTERVAL_SECONDS: ${UPSTREAM_SNAPSHOT_INTERVAL_SECONDS:-10}
      UPSTREAM_SNAPSHOT_DIR: ${UPSTREAM_SNAPSHOT_DIR:-/snapshots}
      UPSTREAM_SNAPSHOT_JPEG_QUALITY: ${UPSTREAM_SNAPSHOT_JPEG_QUALITY:-3}
      UPSTREAM_SNAPSHOT_MAX_FAILURES: ${UPSTREAM_SNAPSHOT_MAX_FAILURES:-6}
      # M6.1B local-frame auto-upload. Default OFF until live-verified
      # against the deployed M6.2-delta endpoint (POST /v1/ingest/snapshots,
      # webhook-secret authed). When 1, snapshotter.sh best-effort uploads
      # each just-published JPEG; an upload failure never affects local
      # extraction or the M4/M5 lifecycle. Reuses UPSTREAM_API_BASE_URL +
      # UPSTREAM_MEDIAMTX_WEBHOOK_SECRET (already set above). session_id and
      # observed width/height are injected per-stream by on_ready.sh step 8;
      # the WIDTH/HEIGHT here are only the fallback when on_ready could not
      # pass positive observed dimensions. UPSTREAM_SESSION_ID is
      # intentionally NOT wired here (per-stream, like UPSTREAM_SNAPSHOT_RTSP_URL).
      # Same `:-default` no-warning form as the M6.1A vars above.
      UPSTREAM_SNAPSHOT_UPLOAD_ENABLED: ${UPSTREAM_SNAPSHOT_UPLOAD_ENABLED:-0}
      UPSTREAM_SNAPSHOT_UPLOAD_MAX_FAILURES: ${UPSTREAM_SNAPSHOT_UPLOAD_MAX_FAILURES:-6}
      UPSTREAM_SNAPSHOT_UPLOAD_TIMEOUT_SECONDS: ${UPSTREAM_SNAPSHOT_UPLOAD_TIMEOUT_SECONDS:-8}
      UPSTREAM_SNAPSHOT_WIDTH: ${UPSTREAM_SNAPSHOT_WIDTH:-1280}
      UPSTREAM_SNAPSHOT_HEIGHT: ${UPSTREAM_SNAPSHOT_HEIGHT:-720}
      UPSTREAM_SNAPSHOT_UPLOAD_EVERY_N_FRAMES: ${UPSTREAM_SNAPSHOT_UPLOAD_EVERY_N_FRAMES:-1}

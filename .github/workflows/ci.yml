# CI-0 (docs/design/07-roadmap.md Phase A; plan in docs/design/06 §7):
# T0 hermetic suites + shell syntax checks + compose validation on every
# push and PR. No network, no real MediaMTX, no api-server — the suites
# stub ffprobe/ffmpeg and run a local mock ingest server.
name: CI

# push is scoped to main so an in-repo PR branch runs once (as
# pull_request), not twice; pull_request stays unrestricted so forks
# and any-base PRs are still covered.
on:
  push:
    branches: [main]
  pull_request:

# Least-privilege token: every job only checks out code.
permissions:
  contents: read

# Cancel superseded runs of the same branch/PR.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  t0:
    name: T0 hermetic suites
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install jq
        run: |
          sudo apt-get update
          sudo apt-get install -y jq

      - name: Syntax-check all shell scripts (bash -n)
        run: |
          set -euo pipefail
          found=0
          while IFS= read -r -d '' f; do
            found=1
            bash -n "$f"
            echo "bash -n ok: $f"
          done < <(find scripts -type f -name '*.sh' -print0 | sort -z)
          # Guard against a refactor silently moving the scripts out of
          # the globbed location and turning this step into a no-op.
          [ "$found" -eq 1 ]

      - name: T0 — comparator fixtures
        run: bash scripts/dev/test_compare.sh

      - name: T0 — on_ready routing (M5.1/M5.2)
        run: bash scripts/dev/test_on_ready_routing.sh

      - name: T0 — snapshotter local extraction (M6.1A)
        run: bash scripts/dev/test_snapshotter_local.sh

      - name: T0 — snapshotter upload (M6.1B)
        run: bash scripts/dev/test_snapshotter_upload.sh

  perception-fanout:
    name: perception-fanout (pytest + e2e)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install perception-fanout deps
        run: pip install -r perception-fanout/requirements-dev.txt

      - name: Hermetic pytest (in-process ASGI, no ports)
        run: python -m pytest perception-fanout/tests -q

      - name: Wire-level e2e (uvicorn on an ephemeral port)
        run: bash scripts/dev/test_perception_fanout.sh

  compose-validate:
    name: docker compose config
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate docker-compose.yml
        run: |
          set -euo pipefail
          # compose interpolates UPSTREAM_* envs; the example file provides
          # placeholder (non-secret) values for the required ones.
          cp .env.example .env
          docker compose config -q

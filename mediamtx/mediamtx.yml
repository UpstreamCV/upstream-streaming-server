# MediaMTX configuration.
#
# M1 scope: accept SRT publishes locally, expose RTSP + WebRTC reads, and
# surface a local HTTP API for inspection. No auth, no media validation.
# M4 (shipped): per-path `runOnReady` / `runOnNotReady` hooks call the API's
# `/v1/ingest/lookup-session` to translate `MTX_PATH` -> `session_id`, then
# POST `stream-started` / `stream-ended` so the dashboard can transition the
# stream into the playable `streaming` state.
# Auth on ingest (validate-stream as a runOnConnect deny gate) and ffprobe
# enforcement (M5) remain deferred — see docs/follow-ups.md.

###############################################################################
# Logging
###############################################################################

logLevel: info
logDestinations: [stdout]

###############################################################################
# HTTP API (local debug only)
###############################################################################

# Enables GET /v3/paths/list and friends. Used by humans during local
# debugging (e.g. `curl localhost:9997/v3/paths/list`).
#
# TODO (production): leave `api: yes` but bind `apiAddress` to 127.0.0.1 so
# it is not reachable off-box. In M1 we expose 9997 in docker-compose.yml
# for convenience; do not do that in prod.
api: yes
apiAddress: :9997

###############################################################################
# Auth (M1: disabled — local dev only)
###############################################################################

# MediaMTX 1.9's default `authInternalUsers` restricts API/metrics/pprof to
# the in-container loopback. Host-side requests come from the Docker bridge
# and would be rejected with 401. For local dev we override with a fully
# permissive set: any publisher/reader/API caller is allowed.
#
# TODO (M4): replace with real auth — either MediaMTX's `authHTTP` pointing
# at `upstream-api-server`, or `authInternalUsers` entries that require an
# admin password for the API and gate publish on a runOnConnect hook.
authInternalUsers:
  - user: any
    pass:
    ips: []
    permissions:
      - action: publish
      - action: read
      - action: playback
      - action: api
      - action: metrics
      - action: pprof

###############################################################################
# Protocols
###############################################################################

# RTSP read endpoint. ffplay and ffprobe in the smoke scripts pull from here.
rtsp: yes
rtspAddress: :8554

# WebRTC read endpoint. Browser-friendly low-latency playback.
webrtc: yes
webrtcAddress: :8889
webrtcLocalUDPAddress: :8189

# Advertise an additional ICE candidate so browsers can reach this
# server from outside its docker network. Without this, MediaMTX only
# advertises the container's docker-bridge IP (e.g. 172.21.0.2) which
# is unreachable from any external host — every WebRTC connection
# attempt hangs in "checking" forever even though signaling succeeds.
#
# Set this to the public hostname or IP that ICE candidates should
# resolve to. Defaults are tuned for the production ingest server; for
# local dev override via `webrtcAdditionalHosts: [127.0.0.1]` in a
# checked-out copy of this file or use `--config` on the mediamtx CLI.
webrtcAdditionalHosts: [ingest.upstreamcv.com]

# HLS intentionally disabled in M1 to keep the surface small. Flip to `yes`
# and expose port 8888 in docker-compose.yml if you want browser playback
# without WebRTC. Future milestones may turn this on for the dashboard.
hls: no

# RTMP not needed — the agent publishes SRT.
rtmp: no

# SRT ingest. This is the primary listener for upstream-agent.
srt: yes
srtAddress: :8890

###############################################################################
# Paths
###############################################################################

# Catch-all path: any publisher with streamid `publish:<name>` creates a
# matching path on the fly. For dev smoke scripts the name is `test`; for
# real API-issued sessions the name is the short opaque key `sess_<hex>`.
# This is intentionally permissive on the auth side — see docs/stream-auth.md
# for the production firewall posture and the deferred runOnConnect deny gate.
#
# `runOnReady` fires when MediaMTX has finished SRT handshake + at least one
# track is decodable. The hook ffprobes the local re-stream, looks up the
# session_id from the streamid, and POSTs `/v1/ingest/stream-started` so the
# session moves `approved` -> `streaming` and the dashboard's WHEP proxy
# unblocks (it returns 409 `session_not_streaming` otherwise).
# `runOnNotReady` fires when the stream stops; it POSTs `/v1/ingest/stream-ended`
# so the API records duration for usage billing and `cameras.status` returns
# to `'idle'`.
# `runOnReadyRestart: no` ensures we do NOT re-run the hook every time the
# stream goes ready; we want exactly one stream-started per ingest cycle.
paths:
  all_others:
    source: publisher
    runOnReady: /hooks/on_ready.sh
    runOnReadyRestart: no
    runOnNotReady: /hooks/on_not_ready.sh
    # TODO (M6): add `runOnReady:` snapshotter for latest-frame JPEG.

# MediaMTX configuration.
#
# M1 scope: accept SRT publishes locally, expose RTSP + WebRTC reads, and
# surface a local HTTP API for inspection.
# M4 (shipped): per-path `runOnReady` / `runOnNotReady` hooks call the API's
# `/v1/ingest/lookup-session` to translate `MTX_PATH` -> `session_id`, then
# POST `stream-started` / `stream-ended` so the dashboard can transition the
# stream into the playable `streaming` state.
# M4.1 (shipped): MediaMTX `authMethod: http` denies SRT publishers whose
# session is missing/expired/wrong-state before any media flows. The api-
# server endpoint is `/v1/ingest/mediamtx-auth/{secret}` — see docs/stream-auth.md.
# ffprobe enforcement (M5) remains deferred — see docs/follow-ups.md.

###############################################################################
# Logging
###############################################################################

logLevel: info
logDestinations: [stdout]

###############################################################################
# HTTP API (local debug only)
###############################################################################

# Enables GET /v3/paths/list and friends. Used by humans during local
# debugging (e.g. `curl localhost:9997/v3/paths/list`).
#
# Exposure (resolved M9.1, docs/design/05-security-hardening.md §3):
# `apiAddress` stays `:9997` in-container (the api-server provisions paths
# through it), but docker-compose.yml now host-binds it to 127.0.0.1 by
# default (UPSTREAM_MEDIAMTX_API_BIND). Production opens it and allow-lists
# the api-server egress IP via scripts/firewall-restrict-readports.sh.
api: yes
apiAddress: :9997

###############################################################################
# Metrics (M9.2)
###############################################################################

# Prometheus metrics endpoint (docs/design/01-observability.md §2, ledger
# LG-1): paths/ready paths, per-path bytes, SRT conn stats. Scraped by
# Prometheus on the monitoring box. docker-compose.yml host-binds 9998 to
# 127.0.0.1 by default (UPSTREAM_MEDIAMTX_METRICS_BIND); prod firewalls it
# to the monitoring box IP only (docs/design/05 §3). The `metrics` action
# is already in authHTTPExclude below, so enabling this adds no authHTTP
# round-trips.
metrics: yes
metricsAddress: :9998

###############################################################################
# Auth (M4.1: SRT publish gated via api-server authHTTP)
###############################################################################

# Every SRT publish attempt is POSTed to the api-server for validation
# BEFORE any media bytes are accepted. On non-2xx the SRT connection is
# dropped at handshake. Read/playback/api/metrics/pprof are excluded —
# M4 scope is publish authorization only; reader auth is a later
# milestone, and the local debug HTTP API on :9997 must stay reachable.
#
# The shared secret rides in the URL path segment because MediaMTX's
# authHTTP request has a fixed JSON body and no custom-header mechanism
# in ANY released version — the M9.0 spike verified `authHTTPHeaders`
# does not exist anywhere (checked through v1.19.1; the earlier "added
# upstream in 1.11+" claim was wrong). Mitigations: the api-server
# redacts the secret from its access logs (already implemented there)
# and production reverse-proxies scrub it too (note below). The URL
# itself is NOT written to this file — MediaMTX 1.9.3 does not expand ${VAR}
# references inside YAML, so docker-compose.yml composes the final URL
# from $UPSTREAM_API_BASE_URL and $UPSTREAM_MEDIAMTX_WEBHOOK_SECRET and
# passes it in as MTX_AUTHHTTPADDRESS, which MediaMTX picks up as the
# override for authHTTPAddress. Keeping it out of YAML also keeps the
# secret out of any image / committed file.
#
# Production deployments MUST configure their reverse-proxy / load
# balancer to strip the trailing path segment from access logs so the
# secret is not captured. See docs/stream-auth.md for the production
# runbook and the api-server endpoint contract.
#
# When authMethod is `http`, `authInternalUsers` is ignored; excluded
# actions are simply allowed without any check.
authMethod: http
# authHTTPAddress is set via MTX_AUTHHTTPADDRESS in docker-compose.yml.
authHTTPExclude:
  - action: api
  - action: metrics
  - action: pprof
  - action: read
  - action: playback

###############################################################################
# Protocols
###############################################################################

# RTSP read endpoint. ffplay and ffprobe in the smoke scripts pull from here.
rtsp: yes
rtspAddress: :8554

# WebRTC read endpoint. Browser-friendly low-latency playback.
webrtc: yes
webrtcAddress: :8889
webrtcLocalUDPAddress: :8189

# Advertise an additional ICE candidate so browsers can reach this
# server from outside its docker network. Without this, MediaMTX only
# advertises the container's docker-bridge IP (e.g. 172.21.0.2) which
# is unreachable from any external host — every WebRTC connection
# attempt hangs in "checking" forever even though signaling succeeds.
#
# Set this to the public hostname or IP that ICE candidates should
# resolve to. Defaults are tuned for the production ingest server; for
# local dev override via `webrtcAdditionalHosts: [127.0.0.1]` in a
# checked-out copy of this file or use `--config` on the mediamtx CLI.
webrtcAdditionalHosts: [ingest.upstreamcv.com]

# HLS intentionally disabled in M1 to keep the surface small. Flip to `yes`
# and expose port 8888 in docker-compose.yml if you want browser playback
# without WebRTC. Future milestones may turn this on for the dashboard.
hls: no

# RTMP not needed — the agent publishes SRT.
rtmp: no

# SRT ingest. This is the primary listener for upstream-agent.
srt: yes
srtAddress: :8890

###############################################################################
# Paths
###############################################################################
#
# Every legitimate path is provisioned dynamically by `upstream-api-server`
# at `/v1/stream-sessions/start` time via MediaMTX's HTTP API
# (`POST /v3/config/paths/add/{sess_<hex>}`). Each provisioned path
# carries its own `srtPublishPassphrase` (Phase 2 / FU-6) AND its own
# `runOnReady` / `runOnNotReady` lifecycle hooks pointing at
# `/hooks/on_ready.sh` and `/hooks/on_not_ready.sh`. The api-server
# DELETEs the path at session end.
#
# No catch-all `all_others` entry on purpose. Before Phase 2 this block
# accepted any streamid with unencrypted SRT and relied solely on the
# authHTTP gate; now an unknown streamid has no matching path entry and
# MediaMTX rejects the SRT connection outright. This makes "agent
# without a current /start" a hard failure (clearer than the prior
# silent-unencrypted fallback) and forecloses on a streamid-guessing
# attacker even reaching the SRT handshake.
#
# Empty `paths:` is intentional and legal in MediaMTX 1.9 — it just
# means "every path is dynamic, none are statically defined".
paths: {}
